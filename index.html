<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해상 점령전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 해전 전략 게임 HUD: 깊은 밤바다 + 네온 시안 계기판 선, 금색은 보상·강조에만. 프로젝터용 단일 다크 테마 */
:root{
  --abyss:#040c1a; --deep:#081a31; --panel:#0d2645; --panel2:#123359; --sea:#0d2e52; --line:#1d5a90;
  --neon:#38e8ff; --gold:#ffc83d; --red:#ff3d5a; --good:#37f59b; --foam:#eef7ff; --mist:#86a8cb;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --num:"Orbitron","Black Han Sans",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --cut:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--foam);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  background-color:var(--abyss);
  background-image:linear-gradient(rgba(56,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(56,232,255,.035) 1px,transparent 1px),
    radial-gradient(ellipse at 15% -10%,#0f3a66 0,transparent 55%),radial-gradient(ellipse at 100% 110%,#0b3050 0,transparent 55%);
  background-size:40px 40px,40px 40px,auto,auto;background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
em{font-style:normal;color:var(--gold)}
.app{max-width:1640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.spacer{flex:1}
.muted{color:var(--mist)}
.center{display:grid;place-items:center;min-height:72vh}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* 상단 HUD */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-family:var(--display);font-size:26px;color:var(--gold);letter-spacing:.04em;text-shadow:0 0 18px rgba(255,200,61,.35)}
.brand small{font-family:var(--body);font-size:13px;color:var(--mist);margin-left:10px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(13,38,69,.85);border:1px solid rgba(56,232,255,.28);padding:5px 12px;font-size:14px;color:var(--mist);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.chip b{color:var(--foam);font-family:var(--num);font-weight:800}
.chip.fire{border-color:var(--red);color:#ffd2d9;background:rgba(120,20,40,.6)}
.flag{width:14px;height:22px;background:var(--pc);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);box-shadow:0 0 10px var(--pc)}
.hud-label{font-family:var(--num);font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--neon);opacity:.85}
.hud-row{display:flex;align-items:baseline;gap:10px}

/* 버튼 */
.btn{border:1px solid rgba(56,232,255,.35);padding:9px 18px;font-size:15px;font-weight:700;background:var(--panel2);color:var(--foam);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.25)}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(180deg,#ffd768,#f0a400);color:#2a1800;border:0;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.04em}
.btn.ghost{background:transparent}
.btn.small{padding:6px 14px;font-size:14px}
.btn.huge{font-size:28px;padding:16px 28px}
.btn.icon{padding:6px 12px;font-size:16px}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.tabs{display:flex;gap:4px}
.tabs .btn.on{background:var(--gold);color:#2a1800;border-color:var(--gold)}

/* 패널 */
.card{background:linear-gradient(180deg,rgba(18,51,89,.92),rgba(8,26,49,.94));border:1px solid rgba(56,232,255,.22);clip-path:var(--cut);padding:18px;position:relative}
.card::before{content:"";position:absolute;left:14px;right:40%;top:0;height:2px;background:linear-gradient(90deg,var(--neon),transparent);opacity:.7}

/* 입력 */
input.field{width:100%;font-size:22px;padding:12px 14px;border:1px solid var(--line);background:rgba(4,12,26,.8);color:var(--foam);font-family:var(--num);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
input#nm{font-family:var(--body)}
label.lbl{font-size:13px;color:var(--mist);display:block;margin-bottom:4px;letter-spacing:.05em}
.err{color:var(--red);min-height:1.5em;font-weight:700}

/* 로고 */
.logo{font-family:var(--display);font-size:64px;line-height:1;color:var(--gold);letter-spacing:.04em;text-shadow:0 4px 0 #8a5a00,0 0 30px rgba(255,200,61,.35)}
.logo small{display:block;font-family:var(--num);font-size:14px;letter-spacing:.35em;color:var(--neon);text-shadow:none;margin-top:12px}

/* 레이아웃 */
.host,.player-view,.lobby{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.host,.player-view,.lobby{grid-template-columns:minmax(0,1fr)}.logo{font-size:44px}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.mapbox{background:radial-gradient(ellipse at 50% 40%,#0e3460,#06182e 75%);border:1px solid rgba(56,232,255,.3);clip-path:var(--cut);padding:12px;position:relative}
.mapbox svg{width:100%;height:auto;display:block}

/* 지도 */
.cell{stroke:#061426;stroke-width:1.6;transition:fill .45s}
.cell.empty{fill:url(#seaG)}
.cell.mine{stroke:#fff;stroke-width:1.8}
.cell.sel-ok{stroke:var(--neon);stroke-width:2.6;stroke-dasharray:6 4;animation:march .9s linear infinite;cursor:pointer}
.cell.sel-ok:hover{filter:brightness(1.6)}
.cell.picked{stroke:#fff;stroke-width:3.4;cursor:pointer}
.cell.flash{animation:pop .9s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
@keyframes march{to{stroke-dashoffset:-20}}
@keyframes pop{0%{transform:scale(.3);filter:brightness(2.6)}100%{transform:scale(1);filter:none}}
.celltxt{font-family:var(--display);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.itm{fill:var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.isl-ring{fill:none;stroke:var(--gold);stroke-width:2;animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mist);padding:8px 4px 0}

/* 문제 */
.qcard{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtag{font-family:var(--num);font-weight:900;font-size:30px;color:var(--neon);text-shadow:0 0 14px rgba(56,232,255,.5)}
.qtag small{font-size:16px;color:var(--mist);text-shadow:none}
.storm{background:linear-gradient(90deg,#ff3d5a,#ff8a3d);color:#fff;font-family:var(--display);padding:4px 14px;font-size:15px;letter-spacing:.03em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);animation:shake 2.5s infinite}
@keyframes shake{0%,90%,100%{transform:none}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}96%{transform:translateX(-2px)}}
.qtext{font-size:23px;font-weight:700;white-space:pre-line;line-height:1.45}
.host .qtext{font-size:26px}
.qimg{max-height:300px;width:auto;max-width:100%;align-self:flex-start;border:2px solid rgba(56,232,255,.4);background:#fff}
.stmts{background:rgba(4,12,26,.7);border-left:3px solid var(--neon);padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.grids{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.grid{display:flex;flex-direction:column;gap:4px;align-items:center}
.grid .glabel{font-family:var(--display);font-size:15px;color:var(--neon);letter-spacing:.1em}
.grid table{border-collapse:collapse;font-family:var(--num);font-weight:800;font-size:22px}
.grid td{width:42px;height:42px;text-align:center;border:2px solid rgba(56,232,255,.45);background:rgba(4,12,26,.85)}
.grid td.var{color:var(--gold);text-shadow:0 0 10px rgba(255,200,61,.6)}
.mini td{width:30px;height:30px;font-size:16px;border-color:rgba(255,255,255,.55);background:rgba(0,0,0,.25)}

/* 학생 정답 버튼 (색+모양) */
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.answers{grid-template-columns:minmax(0,1fr)}}
.ans{display:flex;align-items:center;gap:14px;text-align:left;border:0;color:#fff;padding:16px 18px;min-height:78px;font-size:19px;font-weight:700;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.28);transition:transform .08s,filter .15s}
.ans:hover{filter:brightness(1.15);transform:translateY(-2px)}
.ans:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
.ans .shape{font-size:26px;width:30px;text-align:center;flex:none;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ans.c0{background:#d9304a}.ans.c1{background:#2b63e8}.ans.c2{background:#d99400}.ans.c3{background:#17944f}
.hchoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hchoice{display:flex;align-items:center;gap:10px;background:rgba(4,12,26,.6);border:1px solid rgba(56,232,255,.3);padding:12px 14px;font-size:19px;font-weight:700;min-height:60px}
.hchoice::before{content:"◈";color:var(--neon)}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid rgba(56,232,255,.3);background:rgba(4,12,26,.55);padding:12px 16px;font-size:18px;font-weight:500;min-height:58px}
.choice .mark{font-family:var(--display);font-size:22px;color:var(--gold);flex:none}
.choice.right{border:2px solid var(--good);background:rgba(20,110,70,.35);box-shadow:0 0 22px rgba(55,245,155,.25) inset}
.choice .pct{margin-left:auto;font-family:var(--num);font-weight:800;color:var(--mist);font-size:16px}

/* 타이머 링 */
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:rgba(56,232,255,.15)}
.ring .fg{stroke:var(--neon);stroke-linecap:round;stroke-dasharray:188.5;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 6px var(--neon))}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:900;font-size:24px}
.ring.hot .fg{stroke:var(--red);filter:drop-shadow(0 0 8px var(--red))}
.ring.hot span{color:var(--red);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.18)}}

/* 진행 표시 */
.pips{display:flex;flex-wrap:wrap;gap:5px}
.pips i{width:22px;height:10px;background:rgba(56,232,255,.12);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.pips i.on{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.bar{height:10px;background:rgba(56,232,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--good));transition:width .5s}
.phase-title{font-family:var(--display);font-size:40px;line-height:1.1}
.big{font-family:var(--display);font-size:42px;line-height:1.1}

/* 순위 */
.rank{display:flex;flex-direction:column;gap:5px}
.rank .r{display:grid;grid-template-columns:34px 6px minmax(0,1fr) 70px 54px 26px;gap:8px;align-items:center;font-size:16px;padding:3px 6px}
.rank .r .n{font-family:var(--num);font-weight:800;color:var(--mist);text-align:center}
.rank .r .n.m{font-size:20px}
.rank .r .cb{height:22px;background:var(--pc);box-shadow:0 0 8px var(--pc)}
.rank .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank .r .lb{height:8px;background:rgba(56,232,255,.1)}
.rank .r .lb i{display:block;height:100%;background:var(--pc);opacity:.8}
.rank .r .land{font-family:var(--num);font-weight:800;text-align:right}
.rank .r .d{font-size:13px;font-weight:900;text-align:center}
.rank .r .d.up{color:var(--good)} .rank .r .d.dn{color:var(--red)}
.rank .r.me{background:rgba(255,200,61,.14);outline:1px solid rgba(255,200,61,.6)}
.rank .r.top{background:rgba(255,255,255,.04)}

/* 로비 */
.code{font-family:var(--num);font-weight:900;font-size:96px;letter-spacing:.14em;color:var(--neon);line-height:1;text-shadow:0 0 30px rgba(56,232,255,.55)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ptile{display:flex;align-items:center;gap:10px;background:rgba(4,12,26,.6);border:1px solid rgba(56,232,255,.25);padding:9px 10px;font-size:16px;font-weight:700;min-width:0;animation:drop .45s cubic-bezier(.2,1.5,.4,1) both}
.ptile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes drop{0%{transform:translateY(-14px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;font-size:17px}
.rule b{font-size:30px;text-align:center}
.rule small{color:var(--mist);font-size:14px}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.icard{background:rgba(4,12,26,.6);border:1px solid rgba(255,200,61,.3);padding:10px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;align-items:center}
.icard .ic{font-size:26px;grid-row:span 2;text-align:center}
.icard b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:16px}
.icard span{font-size:12px;color:var(--mist);line-height:1.3}
.ship{font-size:84px;line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}

/* 전황 피드 */
.feed{display:flex;flex-direction:column;gap:6px;font-size:16px;max-height:330px;overflow:auto}
.kf{background:rgba(4,12,26,.6);border-left:5px solid var(--pc,var(--neon));padding:7px 12px;font-weight:700;animation:slide .4s ease-out both}
.kf.me{background:rgba(255,200,61,.16)}
@keyframes slide{0%{transform:translateX(30px);opacity:0}100%{transform:none;opacity:1}}
.banner{background:linear-gradient(90deg,#7a0f22,#c22d1f,#7a0f22);padding:10px 18px;font-family:var(--display);font-size:24px;color:#fff;letter-spacing:.03em;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);animation:shake 2.5s infinite}

/* 학생 결과·에너지 */
.reveal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:680px;width:100%}
.verdict{font-family:var(--display);font-size:64px;line-height:1;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.reveal.hit .verdict{color:var(--good);text-shadow:0 0 30px rgba(55,245,155,.5)}
.reveal.miss .verdict{color:#9fb6d0}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}100%{transform:none;opacity:1}}
.energy{font-family:var(--num);font-weight:900;font-size:110px;line-height:1;color:var(--gold);text-shadow:0 0 40px rgba(255,200,61,.5);animation:stamp .6s .15s cubic-bezier(.2,1.6,.4,1) both}
.parts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.parts .chip{color:var(--foam);font-weight:700}
.radar{width:120px;height:120px;border-radius:50%;border:2px solid rgba(56,232,255,.5);position:relative;overflow:hidden;background:radial-gradient(circle,rgba(56,232,255,.15),transparent 70%)}
.radar::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(56,232,255,.6),transparent 25%);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.energy-left{font-family:var(--num);font-weight:900;font-size:76px;line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(255,200,61,.45)}

/* 시상 */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .pship{font-size:44px;filter:drop-shadow(0 0 12px var(--pc))}
.pod .pname{font-family:var(--display);font-size:22px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pland{font-family:var(--num);font-weight:800;color:var(--mist)}
.pod .pillar{width:100%;display:grid;place-items:center;font-family:var(--num);font-weight:900;font-size:40px;color:#1d1300;background:linear-gradient(180deg,var(--pc),rgba(0,0,0,.25));clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%);animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
.pod.p1 .pillar{height:150px;animation-delay:.6s}.pod.p2 .pillar{height:105px;animation-delay:.3s}.pod.p3 .pillar{height:75px}
.pod.p1 .pname{color:var(--gold);font-size:28px}
@keyframes rise{0%{transform:scaleY(0);transform-origin:bottom}100%{transform:scaleY(1);transform-origin:bottom}}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.award{background:rgba(4,12,26,.6);border:1px solid rgba(255,200,61,.35);padding:12px;text-align:center;animation:drop .5s cubic-bezier(.2,1.5,.4,1) both}
.award .ic{font-size:34px}
.award .who{font-family:var(--display);font-size:20px;color:var(--gold)}
.award .t{font-size:13px;color:var(--mist);letter-spacing:.1em}

/* 정리 화면 */
.tablewrap{overflow-x:auto}
table.res{border-collapse:collapse;font-size:14px;white-space:nowrap}
table.res th,table.res td{border-bottom:1px solid rgba(56,232,255,.18);padding:6px 9px;text-align:center}
table.res th{color:var(--neon);font-family:var(--num);font-size:12px;letter-spacing:.1em}
table.res td.o{color:var(--good);font-weight:900} table.res td.x{color:var(--red);font-weight:900}
.revlist{display:flex;flex-direction:column;gap:6px}
.revitem{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:10px;align-items:center;background:rgba(4,12,26,.6);border:1px solid rgba(56,232,255,.2);padding:10px 12px;text-align:left;font-size:15px}
.revitem.on{border-color:var(--gold);background:rgba(255,200,61,.1)}
.revitem .q{font-family:var(--num);font-weight:900;color:var(--neon)}
.revitem .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.revitem .p{font-family:var(--num);font-weight:900;font-size:18px;text-align:right}
.explain{background:rgba(4,12,26,.75);border-left:3px solid var(--gold);padding:14px 16px;white-space:pre-line;font-size:17px;line-height:1.65}
.bignum{font-family:var(--num);font-weight:900;font-size:40px;color:var(--gold)}

/* 연출 */
.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:rgba(2,8,18,.45);animation:fade 1.6s ease both}
.splash .band{width:100%;padding:22px 16px;text-align:center;background:linear-gradient(90deg,transparent,rgba(8,30,58,.97) 15%,rgba(8,30,58,.97) 85%,transparent);border-block:2px solid var(--neon);animation:swipe 1.6s cubic-bezier(.2,.9,.3,1) both}
.splash .t1{font-family:var(--display);font-size:clamp(44px,8vw,110px);line-height:1;color:var(--foam);letter-spacing:.04em;text-shadow:0 0 30px rgba(56,232,255,.7)}
.splash .t2{font-family:var(--display);font-size:clamp(16px,2vw,24px);color:var(--neon);margin-top:10px}
.splash.storm .band{border-color:var(--red);background:linear-gradient(90deg,transparent,rgba(110,12,30,.97) 15%,rgba(110,12,30,.97) 85%,transparent)}
.splash.storm .t1{text-shadow:0 0 30px rgba(255,61,90,.9)}
.splash.gold .band{border-color:var(--gold)}
.splash.gold .t1{color:var(--gold)}
@keyframes fade{0%,100%{opacity:0}12%,80%{opacity:1}}
@keyframes swipe{0%{transform:translateX(-60%) skewX(-12deg)}18%{transform:translateX(0) skewX(-6deg)}80%{transform:translateX(0) skewX(-6deg)}100%{transform:translateX(60%) skewX(-12deg)}}
.confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#2a1800;font-weight:700;padding:10px 18px;z-index:40;max-width:90vw}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

class LocalStore {

  update(p, o){ for (const k in o) this._setAt(this._parts(p).concat(this._parts(k)), o[k]); this._emit(); return Promise.resolve(); }

}

let S = null;               // 저장소

/* ============================ 교사 진행 ============================ */
async function createRoom(cls, size){
  let code;
  for (let k = 0; k < 20; k++) { code = String(1000 + Math.floor(Math.random() * 9000)); if (MODE.demo || !(await S.get("quizrooms/" + code + "/meta"))) break; }
  await S.set("quizrooms/" + code, { meta:{ cls, size:size || 0, phase:"lobby", q:-1, created:S.now() } });
  ls.set("hostRoom", code);

}
async function writeRoom(obj){ await S.update(ROOM, obj); }
async function startGame(){
  const pids = playerIds(); if (!pids.length) return;
  const b = newBoard(pids, room.meta?.size || 0);
  await writeRoom({ board:JSON.stringify(b) });
  await goQuestion(0);
}
async function goQuestion(q){
  const now = S.now();
  const upd = { "meta/phase":"question", "meta/q":q, "meta/startedAt":now, "meta/endsAt":now + QUESTIONS[q].time * 1000 };
  if (q === STORM_FROM) { const b = board(); spawnStormItems(b); b.events = [{ t:"🌪️ 폭풍 구간 시작! 에너지 2배, 새 아이템 6개 등장" }]; b.evq = q - 1; upd.board = JSON.stringify(b); }
  await writeRoom(upd);
}
async function doReveal(){
  const m = room.meta, b = board(), pids = playerIds();
  pids.forEach(p => addLatePlayer(b, p));
  const ap = computeAP(m.q, answersFor(m.q), b, pids, room.answers);
  await writeRoom({ ["ap/q" + m.q]:JSON.stringify(ap), board:JSON.stringify(b), "meta/phase":"reveal", "meta/endsAt":S.now() + SETTINGS.revealTime * 1000 });
}
async function goMove(){
  const q = room.meta.q, t = q >= STORM_FROM ? SETTINGS.stormMoveTime : SETTINGS.moveTime;
  await writeRoom({ "meta/phase":"move", "meta/endsAt":S.now() + t * 1000 });
}
async function doResolve(){
  const m = room.meta, b = board();
  resolveMoves(b, m.q, movesFor(m.q), apFor(m.q), namesMap());
  await writeRoom({ board:JSON.stringify(b), "meta/phase":"result", "meta/endsAt":S.now() + SETTINGS.resultTime * 1000 });
}
async function nextStep(){
  const m = room.meta;
  if (m.q + 1 >= QUESTIONS.length) await writeRoom({ "meta/phase":"end", "meta/endsAt":0 });
  else await goQuestion(m.q + 1);
}
async function hostTick(){
  const m = room.meta; if (!host.active || !m || host.busy) return;
  const now = S.now(), n = playerIds().length;
  let act = null;
  if (m.phase === "question") { const a = Object.keys(answersFor(m.q)).length; if (now >= m.endsAt || (n && a >= n && now > m.startedAt + 1500)) act = doReveal; }
  else if (m.phase === "reveal" && now >= m.endsAt) act = goMove;
  else if (m.phase === "move") { const mv = movesFor(m.q); const done = Object.values(mv).filter(x => x.done).length; if (now >= m.endsAt || (n && done >= n)) act = doResolve; }
  else if (m.phase === "result" && now >= m.endsAt) act = nextStep;
  if (!act) return;
  host.busy = true;
  try { await act(); } catch(e) { console.error(e); toast("저장 중 문제가 생겼어요. 인터넷 연결을 확인하세요."); }
  finally { host.busy = false; }
}
async function skipPhase(){
  const m = room.meta; if (!m) return;
  host.busy = true;
  try {
    if (m.phase === "question") await doReveal();
    else if (m.phase === "reveal") await goMove();
    else if (m.phase === "move") await doResolve();
    else if (m.phase === "result") await nextStep();
  } finally { host.busy = false; }
}

setInterval(() => { if (host.active) hostTick(); tickTimer(); if (MODE.demo) botTick(); }, 250);

/* ============================ 체험 모드 가상 학생 ============================ */
const bots = { list:[], plan:{} };
async function addBots(n){
  for (let i = 0; i < n; i++) {
    const sid = String(10101 + i), p = "p" + sid;
    bots.list.push(p);
    await S.set(ROOM + "/players/" + p, { sid, name:BOT_NAMES[i] || ("선원" + (i + 1)), joined:S.now() + i });
  }
}
function botTick(){
  const m = room.meta; if (!m || !bots.list.length) return;
  const key = m.phase + ":" + m.q, now = S.now();
  if (bots.plan.key !== key) {
    bots.plan = { key, t:{} };
    for (const p of bots.list) bots.plan.t[p] = now + 1000 + Math.random() * (m.phase === "question" ? Math.min(QUESTIONS[m.q].time * 600, 15000) : 6000);
  }
  for (const p of bots.list) {
    if (bots.plan.t[p] == null || now < bots.plan.t[p]) continue;
    bots.plan.t[p] = null;
    if (m.phase === "question" && !answersFor(m.q)[p]) {
      const Q = QUESTIONS[m.q], acc = m.q >= STORM_FROM ? 0.45 : 0.72;
      const c = Math.random() < acc ? Q.answer : pick([...Array(Q.choices.length).keys()].filter(x => x !== Q.answer));
      S.set(`${ROOM}/answers/q${m.q}/${p}`, { c, t:now - m.startedAt });
    }
    if (m.phase === "move" && !movesFor(m.q)[p]) {
      const b = board(), ap = apFor(m.q)[p]; if (!b || !ap) continue;
      const own = ownSetOf(b, p), chosen = [];
      for (let k = 0; k < ap.ap; k++) {
        const opts = [];
        for (let i = 0; i < NCELL; i++) if (!chosen.includes(i) && canTake(b, i, p, m.q, own)) opts.push(i);
        if (!opts.length) break;
        opts.sort((x, y) => score(b, y) - score(b, x) + (Math.random() - 0.5) * 3);
        chosen.push(opts[0]); own.add(opts[0]);
      }
      S.set(`${ROOM}/moves/q${m.q}/${p}`, { cells:chosen.join(","), done:true });
    }
  }
  function score(b, i){ return (b.items[ck(i)] ? 3 : 0) + (i === ISLAND ? 4 : 0) + (b.owner[ck(i)] ? 1 : 1.5); }
}

/* ============================ 학생 동작 ============================ */
async function joinRoom(code, sid, name){
  const meta = await S.get("quizrooms/" + code + "/meta");
  if (!meta) return "방 코드를 다시 확인하세요.";
  const pid = "p" + sid;
  const old = await S.get("quizrooms/" + code + "/players/" + pid);
  await S.set("quizrooms/" + code + "/players/" + pid, { sid, name, joined:old?.joined || S.now() });
  Object.assign(stu, { pid, sid, name });

}
async function answer(orig){
  const m = room.meta; if (!m || m.phase !== "question" || answersFor(m.q)[stu.pid]) return;
  await S.set(`${ROOM}/answers/q${m.q}/${stu.pid}`, { c:orig, t:Math.max(0, S.now() - m.startedAt) });
}
async function toggleCell(i){
  const m = room.meta, b = board(), ap = apFor(m.q)[stu.pid];
  if (!m || m.phase !== "move" || !b || !ap) return;
  const mv = movesFor(m.q)[stu.pid]; if (mv && mv.done) return;
  let list = stu.picked.slice();

  if (list.length > stu.picked.length) play("pick");
  stu.picked = list;
  await S.set(`${ROOM}/moves/q${m.q}/${stu.pid}`, { cells:list.join(","), done:false });
}

/* ============================ 효과: 연출·효과음·축포 ============================ */
const fx = { key:"", sfx:null, ctx:null, lastSec:-1 };
function sfxOn(){ if (fx.sfx === null) { const v = ls.get("sfx"); fx.sfx = v === null ? (host.active || MODE.demo) : !!v; } return fx.sfx; }
function audio(){ if (!fx.ctx) { try { fx.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (fx.ctx && fx.ctx.state === "suspended") fx.ctx.resume(); return fx.ctx; }
function tone(f, d, type = "square", vol = .06, at = 0, f2 = null){
  const c = fx.ctx; if (!c || c.state !== "running") return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03);
}
const SFX = {
  tick:() => tone(1046, .06, "square", .035),
  go:() => [523, 659, 784].forEach((f, i) => tone(f, .14, "square", .05, i * .09)),
  storm:() => { tone(95, 1, "sawtooth", .09, 0, 50); tone(150, .7, "sawtooth", .05, .2, 70); },
  horn:() => { tone(147, .5, "sawtooth", .07); tone(220, .5, "sawtooth", .05, .06); },
  cap:() => { tone(330, .08, "square", .05); tone(660, .14, "square", .05, .08); },
  hit:() => [784, 988, 1319].forEach((f, i) => tone(f, .13, "triangle", .08, i * .07)),
  miss:() => tone(320, .35, "triangle", .06, 0, 150),
  pick:() => tone(880, .05, "triangle", .05),
  win:() => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .2, "square", .05, i * .13))
};
function play(n){ if (!sfxOn()) return; audio(); try { SFX[n](); } catch(e) {} }
document.addEventListener("pointerdown", () => { if (sfxOn()) audio(); }, { capture:true });
const sfxBtn = () => `<button class="btn icon ghost" data-act="sfx" title="효과음">${sfxOn() ? "🔊" : "🔇"}</button>`;
function splash(t1, t2, cls){
  document.querySelectorAll(".splash").forEach(x => x.remove());
  const d = document.createElement("div"); d.className = "splash " + (cls || "");
  d.innerHTML = `<div class="band"><div class="t1">${esc(t1)}</div>${t2 ? `<div class="t2">${esc(t2)}</div>` : ""}</div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1650);
}
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const P = [...Array(180)].map(() => ({ x:Math.random() * W, y:-20 - Math.random() * H * .6, vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 4, r:5 + Math.random() * 6, a:Math.random() * 6, c:COLORS[Math.floor(Math.random() * 12)] }));
  const t0 = performance.now();
  (function f(t){ x.clearRect(0, 0, W, H); for (const p of P) { p.x += p.vx; p.y += p.vy; p.a += .12; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); } if (t - t0 < 5000) requestAnimationFrame(f); else c.remove(); })(t0);
}
function phaseFX(){
  const m = room.meta; if (!m || !m.phase) return;
  const key = m.phase + ":" + m.q; if (key === fx.key) return; fx.key = key;
  const q = m.q, last = q === QUESTIONS.length - 1;
  if (m.phase === "question") {
    if (q === STORM_FROM) { splash("🌪️ 폭풍 경보", "지금부터 에너지 ×2 · 새 아이템 6개 출현", "storm"); play("storm"); }
    else { splash(last ? "FINAL ROUND" : "ROUND " + (q + 1), last ? "마지막 문제! 역전의 기회" : (q === 0 ? "출항! 첫 문제" : "문제 출제"), last ? "storm" : ""); play("go"); }
  } else if (m.phase === "reveal") {
    if (stu.pid && (!MODE.demo || view.tab === "student")) { const a = apFor(q)[stu.pid]; if (a) play(a.ok ? "hit" : "miss"); }
  } else if (m.phase === "move") { splash("⚔️ 점령 개시!", "에너지만큼 칸을 골라 점령하세요", ""); play("horn"); }
  else if (m.phase === "result") play("cap");
  else if (m.phase === "end") { splash("🏁 작전 종료", "최종 전황 발표", "gold"); play("win"); setTimeout(confetti, 700); }

function phaseTotal(m){ return m.phase === "question" ? QUESTIONS[m.q].time * 1000 : m.phase === "move" ? (m.q >= STORM_FROM ? SETTINGS.stormMoveTime : SETTINGS.moveTime) * 1000 : m.phase === "reveal" ? SETTINGS.revealTime * 1000 : SETTINGS.resultTime * 1000; }
function tickTimer(){
  const m = room.meta, el = $("#timer"), fg = $("#ringfg"), ring = $("#ring");
  if (!m || !el || !m.endsAt) return;
  const left = Math.max(0, m.endsAt - S.now()), sec = Math.ceil(left / 1000);
  el.textContent = sec;
  if (fg) fg.style.strokeDashoffset = (188.5 * (1 - Math.min(1, left / phaseTotal(m)))).toFixed(1);
  const hot = sec <= 5 && (m.phase === "question" || m.phase === "move");
  if (ring) ring.classList.toggle("hot", hot);
  if (hot && sec > 0 && sec !== fx.lastSec && (host.active ? (!MODE.demo || view.tab === "host") : true)) play("tick");
  fx.lastSec = sec;
}

  const top = `<div class="topbar">${MODE.demo ? "" : '<span class="brand">해상 점령전</span>'}<span class="chip"><span class="flag" style="--pc:${color}"></span><b style="font-family:var(--body)">${esc(stu.name)}</b></span>${b ? `<span class="chip">🗺️ 땅 <b>${land}</b>칸</span>` : ""}${pos != null ? `<span class="chip">🏆 <b>${pos + 1}</b>위</span>` : ""}${st >= 2 ? `<span class="chip fire">🔥 <b>${st}</b>연속 명중</span>` : ""}<span class="spacer"></span>${MODE.demo ? "" : sfxBtn()}</div>`;
  if (!m.phase) { el.innerHTML = top + `<div class="center"><div class="card stack">방이 닫혔어요. 선생님께 새 방 코드를 받으세요. <button class="btn small" data-act="leave">다시 승선</button></div></div>`; return; }
  if (m.phase === "lobby") { el.innerHTML = top + `<div class="center"><div class="card reveal"><div class="ship">⛵</div><div class="big">승선 완료!</div><div class="muted" style="font-size:18px">선생님이 출항 신호를 보내면 첫 문제가 나와요.</div><div class="hud-label" style="margin-top:8px">ITEMS · 바다에 숨은 아이템</div>${itemsGrid()}</div></div>`; return; }
  const q = m.q;
  if (stu.pickedQ !== q) { stu.picked = []; stu.pickedQ = q; const mv = movesFor(q)[me]; if (mv && mv.cells) stu.picked = mv.cells.split(",").map(Number); }
  if (m.phase === "question") {
    const Q = QUESTIONS[q], mine = answersFor(q)[me], order = choiceOrder(me, q);
    el.innerHTML = top + (q >= STORM_FROM ? `<div class="banner">🌪️ 폭풍 구간 · 에너지 2배</div>` : "") + `<div class="card qcard" style="max-width:1040px;margin:0 auto;width:100%">${qHead(q)}${questionBody(q)}
      ${mine ? `<div class="reveal" style="margin:10px auto"><div class="radar"></div><div class="big" style="font-size:34px">답 전송 완료</div><div class="muted">다른 선원들을 기다리는 중…</div></div>`
             : `<div class="answers">${order.map((o, k) => `<button class="ans c${k}" data-act="ans" data-fast data-c="${o}"><span class="shape">${SHAPES[k]}</span>${choiceInner(Q.choices[o])}</button>`).join("")}</div>`}</div>`;
    return;
  }
  const ap = apFor(q)[me];
  if (m.phase === "reveal") {
    const Q = QUESTIONS[q], ok = ap && ap.ok;
    el.innerHTML = top + `<div class="center"><div class="card reveal ${ok ? "hit" : "miss"}">
      <div class="verdict">${ok ? "🎯 명중!" : "💨 빗나감"}</div>
      <div class="hud-label">이번 판 에너지</div><div class="energy">⚡${ap ? ap.ap : "-"}</div>
      <div class="parts">${(ap?.parts || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      <div class="hud-label" style="margin-top:6px">정답</div><div class="choice right" style="width:100%"><span class="mark">✔</span>${choiceInner(Q.choices[Q.answer])}</div>
      <div class="muted">곧 지도가 열려요. 노릴 칸을 정해 두세요!</div></div></div>`;
    return;
  }
  const sel = new Set(); let left = 0;
  const mvMe = movesFor(q)[me], done = !!(mvMe && mvMe.done);
  if (m.phase === "move" && b && ap) {
    left = ap.ap - stu.picked.length;
    if (!done && left > 0) { const own = ownSetOf(b, me); stu.picked.forEach(c => own.add(c)); for (let i = 0; i < NCELL; i++) if (!stu.picked.includes(i) && canTake(b, i, me, q, own)) sel.add(i); }
  }
  const key = m.phase + q;
  if (stu.lastPhaseKey !== key) { if (m.phase === "result" && stu.prevOwner && b) { stu.flash = new Set(); for (let i = 0; i < NCELL; i++) if (stu.prevOwner[ck(i)] !== b.owner[ck(i)]) stu.flash.add(i); } else stu.flash = new Set(); if (b) stu.prevOwner = { ...b.owner }; stu.lastPhaseKey = key; }
  let side = "";
  if (m.phase === "move") {
    side = `<div class="card stack">${qHead(q, "CONQUEST")}<div class="row" style="justify-content:space-between;align-items:flex-end"><span class="hud-label">⚡ 남은 에너지</span><span class="energy-left">${ap ? left : 0}<small style="font-size:28px;color:var(--mist)"> / ${ap ? ap.ap : 0}</small></span></div>
      ${done ? `<div class="big" style="font-size:30px;color:var(--good)">작전 확정 ✔</div><div class="muted">다른 선원들의 작전을 기다리는 중…</div>`
             : `<div class="muted">점선으로 빛나는 칸을 눌러 점령할 곳을 고르세요. 🎯 칸을 다시 누르면 취소돼요. 고른 칸에 붙은 칸도 이어서 고를 수 있어요.</div><button class="btn primary huge" data-act="done" data-fast>⚓ 작전 확정</button>`}</div>`;
  } else if (m.phase === "result") {
    side = `<div class="card stack">${qHead(q, "REPORT")}<div class="phase-title" style="font-size:32px">📡 전황 보고</div><div class="feed">${feedHTML(b, q, me)}</div></div>`;
  } else if (m.phase === "end") {
    const rows = QUESTIONS.map((Q, qi) => { const a = answersFor(qi)[me]; return a ? (a.c === Q.answer ? "O" : "X") : "-"; });
    const aw = b ? awards(b, names).filter(a => a.w.includes(me)) : [];
    side = `<div class="card stack"><div class="hud-label">FINAL · 내 최종 순위</div><div class="row" style="align-items:baseline"><span class="energy" style="font-size:90px">${pos != null ? pos + 1 : "-"}</span><span class="big" style="font-size:30px">위</span><span class="spacer"></span><span class="chip">🗺️ <b>${land}</b>칸</span></div>
      ${aw.length ? awardsHTML(aw) : ""}
      <div class="hud-label">나만 보이는 문제별 결과</div><div class="row" style="gap:6px">${rows.map((x, i) => `<span class="chip">Q${i + 1} <b style="color:${x === "O" ? "var(--good)" : x === "X" ? "var(--red)" : "inherit"}">${x}</b></span>`).join("")}</div>
      <div class="muted">틀린 문제는 이제 선생님과 함께 풀어봐요.</div></div>`;
  }
  side += `<div class="card stack"><div class="hud-label">LEADERBOARD</div>${rankHTML(b, names, me, 5)}</div>`;
  el.innerHTML = top + `<div class="player-view"><div class="mapbox">${renderMap(b, { me, picked:stu.picked, selectable:sel, flash:stu.flash, q })}${legendHTML}</div><div class="side">${side}</div></div>`;
}

/* ============================ 클릭 처리 ============================ */
document.addEventListener("click", async e => {
  const cell = e.target.closest(".cell.sel-ok, .cell.picked");
  const studentView = MODE.demo ? view.tab === "student" : !host.active;
  if (cell && studentView) { await toggleCell(+cell.dataset.c); render(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.hasAttribute("data-fast") && e.detail !== 0) return; // 마우스는 pointerdown에서 이미 처리
  return doAct(t);
});
// 화면이 자주 바뀌는 버튼(진행 버튼·정답 버튼)은 누르는 순간 바로 처리해 클릭이 사라지지 않게 함
document.addEventListener("pointerdown", e => {
  const t = e.target.closest("[data-act][data-fast]"); if (!t || e.button !== 0) return;
  doAct(t);
});
async function doAct(t){
  const act = t.dataset.act;
  if (act === "demo-start") return demoStart();
  if (act === "sfx") { fx.sfx = !sfxOn(); ls.set("sfx", fx.sfx); if (fx.sfx) { audio(); play("pick"); } return render(); }
  if (act === "tab-host") { view.tab = "host"; return render(); }
  if (act === "tab-student") { view.tab = "student"; return render(); }
  if (act === "mk" || act === "resume") {
    if ($("#pin").value !== TEACHER_PIN) return $("#err").textContent = "비밀번호가 맞지 않아요.";
    if (act === "mk") {
      const size = parseInt($("#size").value, 10);
      if (!(size >= 2 && size <= 40)) return $("#err").textContent = "반 인원을 2~40 사이 숫자로 입력하세요.";
      ls.set("lastSize", size);
      await createRoom(t.dataset.cls, size);
    }
    else { host.active = true; subscribe("quizrooms/" + ls.get("hostRoom")); }
    return render();
  }
  if (act === "start") return startGame();
  if (act === "skip") return skipPhase();
  if (act === "add-time") return addTime();
  if (act === "end-now") { if (t.dataset.sure) return writeRoom({ "meta/phase":"end", "meta/endsAt":0 }); t.dataset.sure = 1; t.textContent = "정말 끝낼까요? 한 번 더 누르기"; return; }
  if (act === "review") { host.review = { qi:null, show:false }; host.reviewTab = "q"; return render(); }
  if (act === "back-end") { host.review = null; return render(); }
  if (act === "rsel") { host.review = { qi:+t.dataset.q, show:false }; return render(); }
  if (act === "show-exp") { host.review.show = true; return render(); }
  if (act === "rtab-q") { host.reviewTab = "q"; return render(); }
  if (act === "rtab-p") { host.reviewTab = "p"; return render(); }
  if (act === "csv") return downloadCSV();
  if (act === "new-game") { if (MODE.demo) return demoStart(); ls.del("hostRoom"); host.active = false; host.review = null; if (unsub) unsub(); room = {}; return renderTeacherGate($("#app")); }
  if (act === "ans") { await answer(+t.dataset.c); return; }
  if (act === "done") { await finishMove(); return; }
  if (act === "leave") { ls.del("stu"); stu.pid = null; return render(); }
}

/* ============================ 시작 ============================ */
const demo = { size:15 };
async function demoStart(){
  S = new LocalStore(); bots.list = []; bots.plan = {};
  Object.assign(hostPrev, { owner:null, key:"" }); fx.key = ""; rankSnap.q = -1;
  Object.assign(stu, { pid:null, picked:[], pickedQ:-1, prevOwner:null, lastPhaseKey:"" });
  let size = parseInt(($("#dsize") || {}).value, 10);
  if (!(size >= 4 && size <= 30)) size = demo.size || 15;
  demo.size = size;
  const code = await createRoom("체험", size);
  await addBots(size - 1);
  await joinRoom(code, "10199", "나(체험)");
  view.tab = "host";
  render();
}
function boot(){
  if (MODE.demo) { render(); return; }
  try { S = new FireStore(FIREBASE_CONFIG); }
  catch(e) { $("#app").innerHTML = `<div class="center"><div class="card">Firebase 설정을 확인하세요: ${esc(e.message)}</div></div>`; return; }
  if (location.hash === "#teacher") { renderTeacherGate($("#app")); return; }
  const saved = ls.get("stu");
  if (saved && saved.code) {
    S.get("quizrooms/" + saved.code + "/players/p" + saved.sid).then(p => { if (p) { Object.assign(stu, { pid:"p" + saved.sid, sid:saved.sid, name:saved.name }); subscribe("quizrooms/" + saved.code); } else render(); }).catch(() => render());
  }
  render();
}
window.addEventListener("hashchange", () => location.reload());
boot();
</script>
